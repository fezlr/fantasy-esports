query SeriesForTeam($teamId: ID!, $since: String!, $until: String!) {
    allSeries(
        first: 50
        filter: {
            teamId: $teamId
            startTimeScheduled: { gte: $since, lte: $until }
        }
    ) {
        edges {
            node {
                id
                startTimeScheduled
                tournament {
                    name
                }
            }
        }
    }
}