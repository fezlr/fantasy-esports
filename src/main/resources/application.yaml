spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fantasy
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  docker:
    compose:
      enabled: true

telegram:
  bot:
    name: fantasy_esports_bot
    token: ${TELEGRAM_TOKEN}

pandascore:
  base-url: https://api.pandascore.co
  api-key: ${PANDA_SCORE_API_KEY}

grid:
  base-url: https://api-op.grid.gg/central-data/graphql
#  stats-url: https://api-op.grid.gg/statistics-feed/graphql
  live-url: https://api-op.grid.gg/live-data-feed/series-state/graphql
  api-key: ${GRID_API_KEY}
  
github:
  valve-ranking-url: https://api.github.com/repos/ValveSoftware/counter-strike_regional_standings/contents/live

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-secret: ${CLOUDINARY_API_SECRET}
  api-key: ${CLOUDINARY_API_KEY}