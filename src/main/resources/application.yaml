spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fantasy
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  docker:
    compose:
      enabled: true
telegram:
  bot:
    name: fantasy_esports_bot
    token: ${TELEGRAM_TOKEN}
pandascore:
  base-url: https://app.pandascore.co
  api-key: ${PANDA_SCORE_API_KEY}


