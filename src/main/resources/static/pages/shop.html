<section class="page" data-page="shop">
    <div class="shop-header">
        <div>
            <h1 class="shop-header__title">SHOP</h1>
            <span class="shop-header__subtitle">AVAILABLE PACKS</span>
        </div>
        <div class="shop-balance">
            <span class="shop-balance__value">0</span>
            <span class="shop-balance__label">POINTS</span>
        </div>
    </div>

    <div class="shop-packs" id="shop-packs"></div>
</section>

<div class="pack-chances-modal" id="pack-chances-modal" hidden>
    <div class="pack-chances-modal__backdrop" id="pack-chances-modal-backdrop"></div>

    <div class="pack-chances-modal__panel">
        <button
                class="pack-chances-modal__close"
                id="pack-chances-modal-close"
                type="button"
        >
            ×
        </button>

        <div class="pack-chances-modal__header">
            <span class="pack-chances-modal__name" id="pack-chances-modal-name"></span>
            <span class="pack-chances-modal__price" id="pack-chances-modal-price"></span>
        </div>

        <div class="pack-chances-modal__bars" id="pack-chances-modal-bars"></div>

        <button
                class="pack-chances-modal__buy"
                id="pack-chances-modal-buy"
                type="button"
        >
            BUY PACK
        </button>
    </div>
</div>
