<section class="page" data-page="inventory">
    <div class="inventory-header">
        <div>
            <h1 class="inventory-header__title">INVENTORY</h1>
            <span class="inventory-header__subtitle">YOUR COLLECTION</span>
        </div>

        <div class="inventory-balance">
            <span class="inventory-balance__value" id="inventory-balance-value">0</span>
            <span class="inventory-balance__label">POINTS</span>
        </div>
    </div>

    <div class="inventory-tabs">
        <button class="inventory-tabs__btn inventory-tabs__btn--active" data-inventory-tab="cards">
            CARDS
        </button>

        <button class="inventory-tabs__btn" data-inventory-tab="packs">
            PACKS
        </button>
    </div>

    <div id="inventory-cards" class="inventory-section">
        <div id="inventory-card-grid" class="inventory-grid">
            <div class="inventory-loading">Loading...</div>
        </div>
    </div>

    <div id="inventory-packs" class="inventory-section" hidden>
        <div id="inventory-pack-grid" class="packs-grid">
            <div class="inventory-loading">Loading...</div>
        </div>
    </div>
</section>

<div class="player-card-modal" id="inventory-player-modal" hidden>
    <div class="player-card-modal__backdrop" id="inventory-player-modal-backdrop"></div>

    <div class="player-card-modal__panel">
        <button
                class="player-card-modal__close"
                id="inventory-player-modal-close"
                type="button">×</button>

        <div class="player-card-modal__header">
            <img class="player-card-modal__team-logo"
                 id="inventory-modal-team-logo"
                 src=""
                 alt="">

            <img class="player-card-modal__avatar"
                 id="inventory-modal-avatar"
                 src=""
                 alt="">

            <div class="player-card-modal__info">
                <span class="player-card-modal__nickname" id="inventory-modal-nickname"></span>

                <span class="player-card-modal__team" id="inventory-modal-team"></span>

                <span class="player-card-modal__rarity" id="inventory-modal-rarity"></span>
            </div>
        </div>

        <div class="player-card-modal__stats" id="inventory-modal-stats"></div>
    </div>
</div>

<div class="pack-chances-modal" id="inventory-pack-chances-modal" hidden>
    <div class="pack-chances-modal__backdrop" id="inventory-pack-chances-modal-backdrop"></div>

    <div class="pack-chances-modal__panel">
        <button
                class="pack-chances-modal__close"
                id="inventory-pack-chances-modal-close"
                type="button">×</button>

        <div class="pack-chances-modal__header">
            <span class="pack-chances-modal__name" id="inventory-pack-chances-modal-name"></span>
        </div>

        <div class="pack-chances-modal__bars" id="inventory-pack-chances-modal-bars"></div>

        <button
                class="pack-chances-modal__buy"
                id="inventory-pack-chances-modal-open"
                type="button">OPEN</button>
    </div>
</div>

<div class="confirm-modal" id="pack-open-confirm-modal" hidden>
    <div class="confirm-modal__backdrop" id="pack-open-confirm-backdrop"></div>

    <div class="confirm-modal__panel">
        <div class="confirm-modal__text-box">
            <span class="confirm-modal__text" id="pack-open-confirm-text"></span>
        </div>

        <div class="confirm-modal__actions">
            <button
                    class="confirm-modal__button confirm-modal__button--confirm"
                    id="pack-open-confirm-yes"
                    type="button">YES</button>

            <button
                    class="confirm-modal__button confirm-modal__button--cancel"
                    id="pack-open-confirm-close"
                    type="button">CLOSE</button>
        </div>
    </div>
</div>

<div class="pack-reveal-modal" id="pack-reveal-modal" hidden>
    <div class="pack-reveal-modal__backdrop"></div>

    <div class="pack-reveal-modal__panel">
        <div class="pack-reveal__stage">
            <div class="pack-reveal__pack" id="pack-reveal-pack">
                <div class="pack-reveal__pack-icon" id="pack-reveal-pack-icon"></div>
            </div>

            <div class="pack-reveal__flash" id="pack-reveal-flash"></div>

            <div class="pack-reveal__card" id="pack-reveal-card" hidden>
                <div class="pack-reveal__card-visual" id="pack-reveal-card-visual">
                    <img class="pack-reveal__card-image" id="pack-reveal-card-image" src="" alt="">

                    <img class="pack-reveal__card-team-logo" id="pack-reveal-card-team-logo" src="" alt="">

                    <span class="pack-reveal__card-rarity" id="pack-reveal-card-rarity"></span>
                </div>

                <span class="pack-reveal__card-nickname" id="pack-reveal-card-nickname"></span>
                <span class="pack-reveal__card-team" id="pack-reveal-card-team"></span>
                <span class="pack-reveal__card-points" id="pack-reveal-card-points"></span>
            </div>
        </div>

        <span class="pack-reveal__title" id="pack-reveal-title" hidden>YOU GOT</span>

        <button
                class="pack-reveal__close"
                id="pack-reveal-close"
                type="button"
                hidden>CONTINUE</button>
    </div>
</div>
